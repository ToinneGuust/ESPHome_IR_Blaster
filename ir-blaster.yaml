# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml

esphome:
  name: ir-blaster
  friendly_name: IR Blaster

esp8266:
  board: d1_mini

logger:
  level: DEBUG

api:
  encryption:
    key: [REDACTED]

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: IR Blaster Fallback Hotspot
    password: [REDACTED]

# Opens a setup portal if the device cannot connect to the configured Wi-Fi.
captive_portal:

# D5 receives the demodulated signal from the IR receiver module.
remote_receiver:
  - pin: 
      number: D5
      inverted: true # Typical IR receiver modules have active-low outputs.
      mode: INPUT_PULLUP
    id: remote_receiver_1
    # Use `dump: all` temporarily when identifying an unknown remote.
    dump: [nec, panasonic]

  # Connect D6 to an IR LED driver; do not power the IR LED directly from the GPIO.
remote_transmitter:
  - pin: D6
    carrier_duty_percent: 50
    id: remote_transmitter_1

####################################
# BUTTONS
